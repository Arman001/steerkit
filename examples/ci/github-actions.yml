# Copy to .github/workflows/steer.yml in your project.
# Lints the tracker and gates and runs every mechanical gate check on each push and pull request.
# The release job blocks while any P0 is not verified or accepted.

name: steer

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Install your project's dependencies here if your checks need them.
      - name: Lint tracker and gates
        run: python3 steer/bin/steer_check.py lint
      - name: Run gate checks
        run: python3 steer/bin/steer_check.py checks

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Release gate
        run: python3 steer/bin/steer_check.py release
